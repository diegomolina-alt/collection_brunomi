opencollection: 1.0.0

info:
  name: Urpipro_Apis
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""
  clientCertificates:
    - domain: apimextqa.mibanco.com.pe
      type: pkcs12
      pkcs12FilePath: ../certs/client-aes.pfx
      passphrase: tI'2hUAMHs4qTGYx

request:
  scripts:
    - type: before-request
      code: |-
        const requestName = req.getName();
        const url = req.getUrl();

        const authRequests = [
          "Token APIM",
          "Token Front QA",
          "Save Redis"
        ];

        // Evita que las propias peticiones de autenticación
        // vuelvan a ejecutar este script.
        if (!authRequests.includes(requestName)) {

          const isTransversal = url.includes("/transversal-api/");
          const isAks = url.includes("aks_base_url");
          const isApim = url.includes("apim_base_url");

          /*
           * API TRANSVERSAL
           * Necesita Token Front y guardar el token en Redis.
           */
          if (isTransversal) {
            console.log(
              "TRANSVERSAL: renovando Token Front QA y actualizando Redis..."
            );

            await bru.runRequest("auth/Token Front QA");
            await bru.runRequest("auth/Save Redis");
          }

          /*
           * API AKS NORMAL
           * También necesita Token Front y Redis.
           */
          else if (isAks) {
            console.log(
              "AKS: renovando Token Front QA y actualizando Redis..."
            );

            await bru.runRequest("auth/Token Front QA");
            await bru.runRequest("auth/Save Redis");
          }

          /*
           * API APIM
           * Necesita renovar Token APIM.
           * Además, actualizamos Token Front y Redis para los servicios internos.
           */
          else if (isApim) {
            //console.log("APIM: renovando Token APIM, Token Front QA y Redis...");
            await bru.runRequest("auth/Token APIM");
            await bru.runRequest("auth/Token Front QA");
            await bru.runRequest("auth/Save Redis");
          }

          /*
           * URL no identificada
           */
          else {
            console.log(
              `No se identificó el tipo de API para la URL: ${url}`
            );
          }
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
