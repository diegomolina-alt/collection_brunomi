info:
  name: Buscar clientes que tengan campana
  type: http
  seq: 2

http:
  method: GET
  url: "{{apim_base_url}}/customer-relationship/v2/customers/profile-complete?documentType=C&documentNumber={{dni}}"
  headers:
    - name: Authorization-be
      value: Bearer {{ms_access_token}}
    - name: Authorization
      value: Bearer {{apim_access_token}}
    - name: x-consumer-id
      value: URPI_PRO
    - name: x-consumer-request-id
      value: "1"
    - name: x-consumer-correlation-id
      value: "1"
    - name: x-transaction-id
      value: "1"
    - name: x-caller-id
      value: "1"
    - name: Ocp-Apim-Subscription-Key
      value: 68361fdc767e4686855ec88aeb85619f
  params:
    - name: documentType
      value: C
      type: query
    - name: documentNumber
      value: "{{dni}}"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        const dni = body?.customer?.documentNumber;
        const adn = body?.customer?.salesRepReference;
        const email = body?.customer?.email;
        const campaigns = body?.campaigns;

        if (Array.isArray(campaigns) && campaigns.length > 0 && email != null) {
          console.log(
            `✅ CON CAMPAÑA | DNI: ${dni} | ADN: ${adn} | CANTIDAD: ${campaigns.length}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
