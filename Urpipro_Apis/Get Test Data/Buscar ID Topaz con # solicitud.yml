info:
  name: "Buscar ID Topaz con # solicitud"
  type: http
  seq: 11

http:
  method: GET
  url: "{{apim_base_url}}/loan-origination/v1/applicants/applications?identificationType=DNI&identificationValue={{dni}}"
  headers:
    - name: Authorization-be
      value: Bearer {{ms_access_token}}
    - name: Authorization
      value: Bearer {{apim_access_token}}
    - name: x-consumer-id
      value: URPI_PRO
    - name: x-consumer-request-id
      value: "1"
    - name: x-consumer-correlation-id
      value: "1"
    - name: x-transaction-id
      value: "1"
    - name: x-caller-id
      value: "1"
    - name: Ocp-Apim-Subscription-Key
      value: 68361fdc767e4686855ec88aeb85619f
  params:
    - name: identificationType
      value: DNI
      type: query
    - name: identificationValue
      value: "{{dni}}"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        const dni =
          bru.runner?.iterationData?.get?.("dni") ??
          bru.getRequestVar?.("dni") ??
          "SIN DNI";

        if (!Array.isArray(body) || body.length === 0) {
          console.log(`❌ DNI ${dni} → sin solicitudes`);
          return;
        }

        for (const solicitud of body) {

          const applicationId = solicitud.applicationId;
          const idTopaz = solicitud.customerOfferId;

          if (!applicationId) {
            continue;
          }

          console.log(
            `✅ ID Topaz ${idTopaz || "NO ENCONTRADO"} → DNI ${dni} → applicationId ${applicationId}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
