info:
  name: Buscar clientes que tengan pre-solicitudes
  type: http
  seq: 3

http:
  method: GET
  url: "{{apim_base_url}}/customer-relationship/v2/customers/profile-complete?documentType=C&documentNumber={{dni}}"
  headers:
    - name: Authorization-be
      value: Bearer {{ms_access_token}}
    - name: Authorization
      value: Bearer {{apim_access_token}}
    - name: x-consumer-id
      value: URPI_PRO
    - name: x-consumer-request-id
      value: "1"
    - name: x-consumer-correlation-id
      value: "1"
    - name: x-transaction-id
      value: "1"
    - name: x-caller-id
      value: "1"
    - name: Ocp-Apim-Subscription-Key
      value: 68361fdc767e4686855ec88aeb85619f
  params:
    - name: documentType
      value: C
      type: query
    - name: documentNumber
      value: "{{dni}}"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        const dni = body?.customer?.documentNumber;
        const applications = body?.applications ?? [];

        // Buscar TODAS las aplicaciones con estado ACCEPTED
        const acceptedApplications = applications.filter(app =>
          String(app?.statusCode ?? "").toUpperCase() === "ACCEPTED"
        );

        // Solo mostramos clientes que tengan al menos una ACCEPTED
        if (acceptedApplications.length > 0) {
          console.log(
            `✅ CLIENTE CON APPLICATION ACCEPTED | DNI: ${dni} | CANTIDAD: ${acceptedApplications.length}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
